name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle build --no-daemon --warning-mode all
      - name: Verify license documents are present
        run: test -f LICENSE && test -f NOTICE && test -f docs/UPSTREAM_AUDIT.md && test -f docs/LICENSE_COMPLIANCE.md && test -f docs/PERFORMANCE.md
      - name: Verify mod JAR exists and is non-empty
        run: |
          ls -la build/libs/
          for f in build/libs/pickuppop-*.jar; do test -s "$f" || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: pickuppop-jar
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pickuppop-test-reports
          path: build/reports/tests/test/
